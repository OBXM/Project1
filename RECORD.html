
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffd1e8, #d8c5ff);
            background-attachment: fixed;
        }

        .container {
            max-width: 650px;
            margin: auto;
            padding: 25px;
            background: #fce4ec;
            border-radius: 25px;
            box-shadow: 0 8px 25px rgba(120, 60, 150, 0.25);
            text-align: center;
        }

        h1 {
            color: #c04b91;
            margin-bottom: 25px;
        }

        .profile-box {
            border: 2px solid #e88bb8;
            background: #fff5fa;
            padding: 15px;
            border-radius: 15px;
            margin: 12px 0;
            transition: 0.3s;
        }

        .profile-box:nth-child(even) {
            border-color: #c49bea;
        }

        .profile-box:hover {
            transform: translateY(-4px);
            box-shadow: 0 5px 12px rgba(180, 100, 160, 0.2);
        }

        h3 {
            color: #ad5790;
            margin: 0 0 10px;
        }

        p {
            color: #67435e;
            margin: 0;
            font-size: 17px;
        }

        .profile-image {
            margin-top: 25px;
        }

        .profile-image img {
            width: 350px;
            max-width: 100%;
            height: auto;
            border: 8px solid white;
            border-radius: 25px;
            padding: 5px;
            background: #f8c8e0;
            box-shadow: 0 6px 20px rgba(100, 50, 100, 0.3);
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🌸 My Profile 🌸</h1>

        <div class="profile-box">
            <h3>💗 Name English</h3>
            <p>Pattraporn Juntawesirisukh 😙💘</p>
        </div>

        <div class="profile-box">
            <h3>💐 Name Thailand</h3>
            <p>น.ส.ภัทราภรณ์ จันทร์ทวีศิริสุข 💐🫰</p>
        </div>

        <div class="profile-box">
            <h3>🎂 Age</h3>
            <p>19</p>
        </div>

        <div class="profile-box">
            <h3>🧸 Nick Name</h3>
            <p>Oum</p>
        </div>

        <div class="profile-box">
            <h3>💕 Status</h3>
            <p>Sweetheart11 🐷😜</p>
        </div>

        <div class="profile-box">
            <h3>🎸 Hobby</h3>
            <p>นอน เล่นกีต้าร์ 🎸💤</p>
        </div>

        <div class="profile-box">
            <h3>🌹 Favorite Flower</h3>
            <p>Blue Rose 🌹</p>
        </div>

        <div class="profile-image">
            <img src="151249.jpg" alt="My Profile Picture">
        </div>

    </div>

</body>
</html>
