
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile 🌸</title>

    <style>
        /* ตั้งค่าทั่วไป */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 35px 15px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffd1e8, #d8c5ff);
            background-attachment: fixed;
        }

        /* กรอบใหญ่รอบทั้งหน้า */
        .container {
            max-width: 750px;
            margin: auto;
            padding: 35px;
            background: linear-gradient(145deg, #fff0f7, #f1e5ff);
            border: 6px double #d77bb5;
            border-radius: 35px;
            box-shadow: 0 10px 35px rgba(150, 70, 130, 0.3);
            text-align: center;
        }

        /* หัวข้อหลัก */
        h1 {
            color: #b83280;
            font-size: 36px;
            font-weight: 900;
            text-shadow: 2px 2px 4px #f5b8dc;
            margin-bottom: 30px;
        }

        /* กรอบข้อความ */
        .profile-box {
            border: 2px solid #e88bb8;
            background: #ffffff;
            padding: 18px;
            border-radius: 18px;
            margin: 15px 0;
            transition: 0.3s;
        }

        .profile-box:nth-of-type(even) {
            border-color: #ad83dc;
            background: #fcf8ff;
        }

        /* เอฟเฟกต์เมื่อนำเมาส์ไปชี้ */
        .profile-box:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 15px rgba(180, 100, 160, 0.2);
        }

        /* หัวข้อแต่ละส่วน */
        h3 {
            color: #a83279;
            font-size: 22px;
            font-weight: bold;
            margin: 0 0 12px;
        }

        /* รายละเอียด */
        p {
            color: #59334f;
            font-size: 19px;
            font-weight: bold;
            line-height: 1.8;
            margin: 0;
        }

        /* รูปภาพ */
        .profile-image {
            margin-top: 30px;
        }

        .profile-image img {
            width: 350px;
            max-width: 100%;
            height: auto;
            border: 8px solid #ffffff;
            outline: 3px solid #d77bb5;
            border-radius: 25px;
            padding: 5px;
            background: #f8c8e0;
            box-shadow: 0 8px 20px rgba(100, 50, 100, 0.3);
        }

        /* ข้อความท้ายหน้า */
        .footer {
            margin-top: 25px;
            color: #b83280;
            font-size: 15px;
            font-weight: bold;
        }

        /* รองรับโทรศัพท์มือถือ */
        @media (max-width: 600px) {
            body {
                padding: 15px 10px;
            }

            .container {
                padding: 20px 15px;
                border-width: 4px;
            }

            h1 {
                font-size: 28px;
            }

            h3 {
                font-size: 19px;
            }

            p {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🌸 My Profile 🌸</h1>

        <div class="profile-box">
            <h3>💗 Name English</h3>
            <p>Pattraporn Juntawesirisukh 😙💘</p>
        </div>

        <div class="profile-box">
            <h3>💐 Name Thailand</h3>
            <p>น.ส.ภัทราภรณ์ จันทร์ทวีศิริสุข 💐🫰</p>
        </div>

        <div class="profile-box">
            <h3>🎂 Age</h3>
            <p>19</p>
        </div>

        <div class="profile-box">
            <h3>🧸 Nick Name</h3>
            <p>Oum</p>
        </div>

        <div class="profile-box">
            <h3>💕 Status</h3>
            <p>Sweetheart 🐷😜</p>
        </div>

        <div class="profile-box">
            <h3>🎸 Hobby</h3>
            <p>นอน เล่นกีต้าร์ 🎸💤</p>
        </div>

        <div class="profile-box">
            <h3>🌹 Favorite Flower</h3>
            <p>Blue Rose 🌹</p>
        </div>

        <!-- รูปโปรไฟล์ -->
        <div class="profile-image">
            <img src="151249.jpg" alt="My Profile Picture">
        </div>

        <div class="footer">
            💗 Thank you for visiting my profile 💗
        </div>

    </div>

</body>
</html>
